name: Update Base Types

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: update-basetypes
  cancel-in-progress: false

jobs:
  update-basetypes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update BaseTypes.csv from upstream
        run: npm run update-basetypes

      - name: Detect BaseTypes-related changes
        id: changes
        run: |
          if git diff --quiet -- src/assets/BaseTypes.csv src/types/items.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate item types
        if: steps.changes.outputs.changed == 'true'
        run: npm run generate-types

      # GITHUB_TOKEN-created PRs do not trigger normal pull_request workflows.
      - name: Validate generated changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm run check
          npm run frontend:build
          npm audit --audit-level=high

      - name: Create pull request
        id: pull-request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: chore/update-basetypes
          commit-message: "chore: update BaseTypes.csv"
          title: "chore: update BaseTypes.csv"
          body: |
            Updates `src/assets/BaseTypes.csv` from the upstream FilterBlade public assets repo.

            This PR was created automatically after type generation, backend/frontend typechecks, tests, formatting, frontend build and dependency audit. Review filter behavior before merging.
          add-paths: |
            src/assets/BaseTypes.csv
            src/types/items.ts
            src/types/weapon-base-data.ts
            src/types/autogenerated

      # Explicit dispatch is allowed with GITHUB_TOKEN and supplies the normal
      # Linux/Windows checks required by branch protection on the generated PR.
      - name: Run CI on the update branch
        if: steps.pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref chore/update-basetypes
