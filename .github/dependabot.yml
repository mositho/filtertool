version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      compatible-dependencies:
        update-types: [minor, patch]
        patterns: ["*"]
        exclude-patterns: [ffmpeg-static]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]
